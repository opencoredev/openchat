name: Preview Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup-convex-preview:
    name: Cleanup Convex Preview
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    
    steps:
      - name: Delete Convex Preview Deployment
        env:
          CONVEX_TEAM_ACCESS_TOKEN: ${{ secrets.CONVEX_TEAM_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUM=${{ github.event.pull_request.number }}
          PREVIEW_IDENTIFIER="pr-${PR_NUM}"
          CONVEX_PROJECT_ID="1236982"

          echo "🧹 Looking up Convex preview deployment: ${PREVIEW_IDENTIFIER}"

          # List all deployments for the project and find the one matching our PR
          DEPLOYMENT_NAME=$(curl -s \
            "https://api.convex.dev/v1/projects/${CONVEX_PROJECT_ID}/list_deployments" \
            -H "Authorization: Bearer ${CONVEX_TEAM_ACCESS_TOKEN}" | \
            python3 -c "
          import sys, json
          deployments = json.load(sys.stdin)
          for d in deployments:
              if d.get('previewIdentifier') == '$PREVIEW_IDENTIFIER':
                  print(d['name'])
                  break
          " 2>/dev/null || true)

          if [ -z "$DEPLOYMENT_NAME" ]; then
            echo "⚠️ No Convex deployment found for ${PREVIEW_IDENTIFIER} (may have already been cleaned up)"
            exit 0
          fi

          echo "   Found deployment: ${DEPLOYMENT_NAME}"

          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST \
            "https://api.convex.dev/v1/deployments/${DEPLOYMENT_NAME}/delete" \
            -H "Authorization: Bearer ${CONVEX_TEAM_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "204" ]; then
            echo "✅ Convex preview deployment '${DEPLOYMENT_NAME}' deleted successfully"
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "⚠️ Convex deployment not found (may have already been cleaned up)"
          else
            echo "❌ Failed to delete Convex preview deployment"
            echo "   HTTP Code: $HTTP_CODE"
            echo "   Response: $BODY"
            exit 1
          fi

      - name: Delete Vercel Branch Env Vars
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BRANCH_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          PROJECT_ID="prj_PydnhiRsYKJ4ASMIhsYZSJY5rqhT"
          TEAM_ID="team_HuxyDiDenUAZ2TsD2llXhJZq"
          ENCODED_BRANCH=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$BRANCH_REF")

          ENV_IDS=$(curl -s \
            "https://api.vercel.com/v9/projects/${PROJECT_ID}/env?teamId=${TEAM_ID}&gitBranch=${ENCODED_BRANCH}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" | \
            python3 -c "
          import sys,json
          data = json.load(sys.stdin)
          keys = {'VITE_CONVEX_URL', 'VITE_CONVEX_SITE_URL'}
          for e in data.get('envs', []):
              if e.get('key') in keys and e.get('gitBranch') == '$BRANCH_REF':
                  print(e['id'])
          " 2>/dev/null || true)

          if [ -z "$ENV_IDS" ]; then
            echo "No branch-scoped Vercel env vars found for ${BRANCH_REF}"
          else
            for ENV_ID in $ENV_IDS; do
              curl -s -X DELETE \
                "https://api.vercel.com/v9/projects/${PROJECT_ID}/env/${ENV_ID}?teamId=${TEAM_ID}" \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" > /dev/null
              echo "  Deleted env var id=${ENV_ID}"
            done
            echo "✅ Vercel branch env vars deleted"
          fi

      - name: Summary
        if: always()
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          echo "## Preview Cleanup Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Convex Preview (pr-${PR_NUM}) | 🧹 Cleaned up |" >> $GITHUB_STEP_SUMMARY
          echo "| Vercel Branch Env Vars | 🧹 Deleted |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend (Vercel) | 🧹 Auto-cleaned by Vercel |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Vercel preview deployments are automatically deleted when the PR is closed._" >> $GITHUB_STEP_SUMMARY
