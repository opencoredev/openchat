name: Build Android APK (Local)

on:
  push:
    branches: [feature/mobile-app]
    paths:
      - 'apps/native/**'
      - '.github/workflows/build-android-local.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Expo prebuild → Gradle assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      EXPO_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      EXPO_PUBLIC_AUTH_BASE_URL: https://placeholder.convex.site
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"
      EXPO_NO_TELEMETRY: "1"
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK (clean)
        uses: android-actions/setup-android@v3
        with:
          packages: >
            tools
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;26.1.10909125
            cmake;3.22.1

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.5' }

      - name: Install native dependencies
        working-directory: apps/native
        run: bun install --ignore-scripts

      - name: Expo prebuild
        working-directory: apps/native
        continue-on-error: true
        run: node_modules/.bin/expo prebuild --platform android --clean --no-install 2>&1
        env:
          EXPO_NO_TELEMETRY: "1"

      - name: Make gradlew executable
        run: chmod +x apps/native/android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}-v5
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        working-directory: apps/native/android
        run: |
          ./gradlew assembleDebug --no-daemon --no-build-cache --stacktrace 2>&1 | tee /tmp/gradle.log | tail -80

      # Copy the APK to the workspace root with a known flat name
      # This sidesteps any deep-path issues with upload-artifact
      - name: Copy APK to workspace root
        id: copy-apk
        run: |
          APK_SRC="apps/native/android/app/build/outputs/apk/debug/app-debug.apk"
          APK_DEST="openchat-debug.apk"
          if [ -f "$APK_SRC" ]; then
            cp "$APK_SRC" "$APK_DEST"
            SIZE=$(du -h "$APK_DEST" | cut -f1)
            echo "Copied $APK_SRC -> $APK_DEST ($SIZE)"
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::APK not found at $APK_SRC"
            echo "All APK files:"
            find . -name "*.apk" -not -path "*/node_modules/*" 2>/dev/null || echo "(none)"
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log-${{ github.run_number }}
          path: /tmp/gradle.log
          if-no-files-found: ignore
          retention-days: 7

      # Primary: upload the flat copy from workspace root
      - name: Upload APK (flat copy)
        if: steps.copy-apk.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openchat-android-debug-run${{ github.run_number }}
          path: openchat-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Fallback: upload entire debug output dir if something different happened
      - name: Upload APK output dir (fallback)
        if: steps.copy-apk.outputs.found == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: openchat-android-debug-run${{ github.run_number }}-fallback
          path: apps/native/android/app/build/outputs/apk/
          if-no-files-found: warn
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          FOUND="${{ steps.copy-apk.outputs.found }}"
          if [ "$FOUND" = "true" ]; then
            SIZE=$(du -h openchat-debug.apk 2>/dev/null | cut -f1 || echo "unknown")
            echo "### ✅ Android Debug APK built successfully!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**File:** openchat-debug.apk ($SIZE)" >> $GITHUB_STEP_SUMMARY
            echo "**Artifact:** \`openchat-android-debug-run${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Install on Pixel 9:** Download zip → unzip → enable Install unknown apps → tap APK" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ APK not found at expected path" >> $GITHUB_STEP_SUMMARY
            echo "Check the gradle-log artifact for the full build output." >> $GITHUB_STEP_SUMMARY
          fi
