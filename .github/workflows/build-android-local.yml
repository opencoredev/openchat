name: Build Android APK (Local)

on:
  push:
    branches: [feature/mobile-app]
    paths:
      - 'apps/native/**'
      - '.github/workflows/build-android-local.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Expo prebuild → Gradle assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      EXPO_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      EXPO_PUBLIC_AUTH_BASE_URL: https://placeholder.convex.site
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"
      EXPO_NO_TELEMETRY: "1"
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK (clean)
        uses: android-actions/setup-android@v3
        with:
          packages: >
            tools
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;26.1.10909125
            cmake;3.22.1

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.5' }

      # --ignore-scripts avoids postinstall issues in CI
      - name: Install native dependencies
        working-directory: apps/native
        run: bun install --ignore-scripts

      # continue-on-error lets the job proceed even if prebuild
      # exits non-zero (it still generates the android/ directory)
      - name: Expo prebuild
        working-directory: apps/native
        continue-on-error: true
        run: node_modules/.bin/expo prebuild --platform android --clean --no-install 2>&1
        env:
          EXPO_NO_TELEMETRY: "1"

      - name: Locate gradlew
        id: find-android
        run: |
          GRADLEW=$(find . -name "gradlew" -not -path "*/node_modules/*" 2>/dev/null | head -1)
          [ -n "$GRADLEW" ] || { echo "::error::No gradlew found after prebuild"; exit 1; }
          chmod +x "$GRADLEW"
          ANDROID_DIR=$(dirname "$GRADLEW")
          echo "android_dir=$ANDROID_DIR" >> $GITHUB_OUTPUT
          echo "Found android dir: $ANDROID_DIR"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}-v2
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        working-directory: ${{ steps.find-android.outputs.android_dir }}
        run: |
          echo "=== Build environment ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME/build-tools/ 2>/dev/null || true
          ls $ANDROID_HOME/platforms/ 2>/dev/null || true
          echo "=== Gradle build ==="
          ./gradlew assembleDebug --no-daemon --no-build-cache --stacktrace 2>&1 | tee /tmp/gradle.log | tail -80

      # List all APKs produced so we know the real output path
      - name: List APK files
        id: list-apk
        run: |
          echo "=== All APKs produced ==="
          find . -name "*.apk" -not -path "*/node_modules/*" 2>/dev/null | tee /tmp/apk-list.txt
          APK=$(head -1 /tmp/apk-list.txt)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"
          ls -lh "$APK" 2>/dev/null || echo "(not found)"

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log-${{ github.run_number }}
          path: |
            /tmp/gradle.log
            /tmp/apk-list.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openchat-android-debug-${{ github.run_number }}
          path: ${{ steps.list-apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: success()
        run: |
          APK="${{ steps.list-apk.outputs.apk_path }}"
          SIZE=$(du -h "$APK" 2>/dev/null | cut -f1 || echo "unknown")
          echo "### ✅ OpenChat Android Debug APK" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | \`openchat-android-debug-${{ github.run_number }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| File | \`$(basename $APK)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Size | $SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Install on Pixel 9:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Download zip from Artifacts section below" >> $GITHUB_STEP_SUMMARY
          echo "2. Unzip → transfer APK to phone" >> $GITHUB_STEP_SUMMARY
          echo "3. Settings → Apps → Special app access → Install unknown apps → Allow" >> $GITHUB_STEP_SUMMARY
          echo "4. Open Files app → tap APK → Install" >> $GITHUB_STEP_SUMMARY
