name: Build Android APK (Local)

on:
  push:
    branches: [feature/mobile-app]
    paths:
      - 'apps/native/**'
      - '.github/workflows/build-android-local.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Expo prebuild → Gradle assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      EXPO_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      EXPO_PUBLIC_AUTH_BASE_URL: https://placeholder.convex.site
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"
      EXPO_NO_TELEMETRY: "1"
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK (clean)
        uses: android-actions/setup-android@v3
        with:
          packages: >
            tools
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;26.1.10909125
            cmake;3.22.1

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.5' }

      # Install from workspace root so monorepo deps are resolved
      - name: Install ALL workspace dependencies
        run: bun install --ignore-scripts

      - name: Expo prebuild
        working-directory: apps/native
        continue-on-error: true
        run: node_modules/.bin/expo prebuild --platform android --clean --no-install 2>&1
        env:
          EXPO_NO_TELEMETRY: "1"

      - name: Make gradlew executable
        run: chmod +x apps/native/android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}-v7
          restore-keys: ${{ runner.os }}-gradle-

      # Build the APK.
      # BUNDLE_SKIP_METRO_BUNDLER=true tells React Native Gradle not to run Metro,
      # and we pre-bundle separately to avoid JS bundler issues in CI.
      - name: Bundle JS with Metro
        working-directory: apps/native
        continue-on-error: true
        run: |
          mkdir -p android/app/src/main/assets
          node_modules/.bin/react-native bundle \
            --platform android \
            --dev false \
            --entry-file node_modules/expo-router/entry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            2>&1 | tee /tmp/metro.log | tail -30 || true

      - name: Build debug APK
        working-directory: apps/native/android
        run: |
          # Run Gradle; capture entire log (no tail truncation)
          ./gradlew assembleDebug \
            --no-daemon \
            --no-build-cache \
            --stacktrace \
            --info \
            2>&1 > /tmp/gradle.log
          GRADLE_EXIT=$?
          echo "Gradle exit: $GRADLE_EXIT"
          tail -60 /tmp/gradle.log
          exit $GRADLE_EXIT

      - name: List build outputs
        if: always()
        run: |
          echo "=== apps/native/android/app/build/outputs/ ==="
          find apps/native/android/app/build/outputs/ -type f 2>/dev/null | head -30 || echo "(not found)"
          echo ""
          echo "=== All APKs ==="
          find . -name "*.apk" 2>/dev/null || echo "(none)"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-run${{ github.run_number }}
          path: |
            /tmp/gradle.log
            /tmp/metro.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openchat-android-debug-run${{ github.run_number }}
          path: apps/native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload all build outputs (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: android-build-outputs-run${{ github.run_number }}
          path: apps/native/android/app/build/outputs/
          if-no-files-found: warn
          retention-days: 14
