name: Build Android APK (Local)

on:
  push:
    branches: [feature/mobile-app]
    paths:
      - 'apps/native/**'
      - '.github/workflows/build-android-local.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Expo prebuild → Gradle assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      EXPO_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      EXPO_PUBLIC_AUTH_BASE_URL: https://placeholder.convex.site
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"
      EXPO_NO_TELEMETRY: "1"
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK (clean)
        uses: android-actions/setup-android@v3
        with:
          packages: >
            tools
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;26.1.10909125
            cmake;3.22.1

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.5' }

      - name: Install native dependencies
        working-directory: apps/native
        run: bun install --ignore-scripts

      - name: Expo prebuild
        working-directory: apps/native
        continue-on-error: true
        run: node_modules/.bin/expo prebuild --platform android --clean --no-install 2>&1
        env:
          EXPO_NO_TELEMETRY: "1"

      - name: Make gradlew executable
        run: |
          GRADLEW=$(find . -name "gradlew" -not -path "*/node_modules/*" | head -1)
          chmod +x "$GRADLEW"
          echo "Android dir: $(dirname $GRADLEW)"
          echo "gradlew=$GRADLEW"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}-v4
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        working-directory: apps/native/android
        run: |
          ./gradlew assembleDebug --no-daemon --no-build-cache --stacktrace 2>&1 | tee /tmp/gradle.log | tail -80

      - name: List APK output
        run: |
          echo "=== APK output directory ==="
          ls -lh apps/native/android/app/build/outputs/apk/debug/ 2>/dev/null || echo "(not found)"
          echo ""
          echo "=== All .apk files ==="
          find . -name "*.apk" -not -path "*/node_modules/*" 2>/dev/null

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log-${{ github.run_number }}
          path: /tmp/gradle.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openchat-android-debug-${{ github.run_number }}
          path: apps/native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: success()
        run: |
          echo "### ✅ OpenChat Android Debug APK" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact:** \`openchat-android-debug-${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Install on your Pixel 9:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Scroll to Artifacts at the bottom of this run page" >> $GITHUB_STEP_SUMMARY
          echo "2. Download the zip, unzip to get app-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo "3. Transfer to phone, enable Install unknown apps, tap APK" >> $GITHUB_STEP_SUMMARY
