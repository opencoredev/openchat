name: Build Android APK (Local)

on:
  push:
    branches: [feature/mobile-app]
    paths:
      - 'apps/native/**'
      - '.github/workflows/build-android-local.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Expo prebuild → Gradle assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      EXPO_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      EXPO_PUBLIC_AUTH_BASE_URL: https://placeholder.convex.site
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"
      EXPO_NO_TELEMETRY: "1"
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >
            tools
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;26.1.10909125
            cmake;3.22.1

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.5' }

      - name: Install workspace dependencies
        run: bun install --ignore-scripts

      - name: Expo prebuild
        working-directory: apps/native
        continue-on-error: true
        run: node_modules/.bin/expo prebuild --platform android --clean --no-install 2>&1
        env:
          EXPO_NO_TELEMETRY: "1"

      - name: Write local.properties (sdk.dir)
        run: |
          # Expo prebuild generates android/ but doesn't always write local.properties
          # Gradle requires sdk.dir to locate the Android SDK.
          echo "sdk.dir=$ANDROID_HOME" > apps/native/android/local.properties
          echo "Written local.properties:"
          cat apps/native/android/local.properties
          echo ""
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME" 2>/dev/null || echo "ANDROID_HOME dir not found"

      - name: Make gradlew executable
        run: chmod +x apps/native/android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/native/android/gradle/wrapper/gradle-wrapper.properties') }}-v8
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        working-directory: apps/native/android
        run: |
          echo "=== Gradle version check ==="
          ./gradlew --version 2>&1 | head -10
          echo ""
          echo "=== Build ==="
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            2>&1 | tee /tmp/gradle.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          echo "Gradle exit code: $GRADLE_EXIT"
          echo "=== Last 80 lines ==="
          tail -80 /tmp/gradle.log
          exit $GRADLE_EXIT

      - name: List build outputs
        if: always()
        run: |
          echo "=== build/outputs tree ==="
          find apps/native/android/app/build/outputs -type f 2>/dev/null | head -30 || echo "(empty)"
          echo ""
          echo "=== All APKs ==="
          find . -name "*.apk" 2>/dev/null || echo "(none)"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-run${{ github.run_number }}
          path: /tmp/gradle.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openchat-android-debug-run${{ github.run_number }}
          path: apps/native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30
