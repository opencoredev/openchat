name: Build Android APK (Local)

on:
  push:
    branches: [feature/mobile-app]
    paths:
      - 'apps/native/**'
      - '.github/workflows/build-android-local.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Expo prebuild → Gradle assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      EXPO_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      EXPO_PUBLIC_AUTH_BASE_URL: https://placeholder.convex.site
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"
      EXPO_NO_TELEMETRY: "1"
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK (clean)
        uses: android-actions/setup-android@v3
        with:
          packages: >
            tools
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;26.1.10909125
            cmake;3.22.1

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.5' }

      - name: Install native dependencies
        working-directory: apps/native
        run: bun install --ignore-scripts

      - name: Expo prebuild
        working-directory: apps/native
        continue-on-error: true
        run: node_modules/.bin/expo prebuild --platform android --clean --no-install 2>&1
        env:
          EXPO_NO_TELEMETRY: "1"

      - name: Make gradlew executable
        run: chmod +x apps/native/android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}-v6
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        working-directory: apps/native/android
        run: |
          ./gradlew assembleDebug --no-daemon --no-build-cache --stacktrace 2>&1 | tee /tmp/gradle.log | tail -80

      # Full filesystem search for APKs and copy all to /tmp/apks/
      - name: Collect all produced APKs
        id: collect
        run: |
          mkdir -p /tmp/apks
          echo "=== Searching entire workspace for .apk files ==="
          find . -name "*.apk" 2>/dev/null | tee /tmp/apk-all.txt
          echo ""
          echo "=== Searching /tmp for .apk files ==="
          find /tmp -name "*.apk" 2>/dev/null | tee -a /tmp/apk-all.txt
          echo ""
          echo "=== Searching /home for .apk files ==="
          find /home -name "*.apk" 2>/dev/null | tee -a /tmp/apk-all.txt
          echo ""
          echo "=== All build outputs dirs ==="
          find . -name "*.apk" -o -path "*/build/outputs*" 2>/dev/null | head -40
          echo ""
          echo "=== Gradle app build dir ==="
          ls -lhR apps/native/android/app/build/ 2>/dev/null | head -60 || echo "(not found)"
          echo ""
          # Copy all found APKs to flat /tmp/apks/
          COUNT=0
          while IFS= read -r apk; do
            if [ -f "$apk" ]; then
              DEST="/tmp/apks/$(basename $apk .apk)-$COUNT.apk"
              cp "$apk" "$DEST"
              echo "Copied: $apk -> $DEST ($(du -h $DEST | cut -f1))"
              COUNT=$((COUNT+1))
            fi
          done < /tmp/apk-all.txt
          echo "Total APKs found: $COUNT"
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Upload Gradle log and APK list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_number }}
          path: |
            /tmp/gradle.log
            /tmp/apk-all.txt
          if-no-files-found: ignore
          retention-days: 7

      # Upload every APK found (flat copy in /tmp/apks/)
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: openchat-android-debug-run${{ github.run_number }}
          path: /tmp/apks/
          if-no-files-found: warn
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          COUNT="${{ steps.collect.outputs.count }}"
          if [ "$COUNT" -gt "0" ] 2>/dev/null; then
            echo "### ✅ Android APK built ($COUNT file(s))" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Artifact:** \`openchat-android-debug-run${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "APKs produced:" >> $GITHUB_STEP_SUMMARY
            cat /tmp/apk-all.txt | while read l; do echo "- \`$l\`"; done >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ No APK found" >> $GITHUB_STEP_SUMMARY
            echo "Gradle exited successfully but produced no .apk files. Check build-diagnostics artifact." >> $GITHUB_STEP_SUMMARY
          fi
