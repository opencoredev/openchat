name: Build Android APK (debug)

on:
  push:
    branches: [feature/mobile-app]
  workflow_dispatch:

jobs:
  build-android:
    name: Expo prebuild → Gradle assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      EXPO_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      EXPO_PUBLIC_AUTH_BASE_URL: https://placeholder.convex.site
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"
      EXPO_NO_TELEMETRY: "1"
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.5' }

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/native/package.json') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install native dependencies (standalone)
        working-directory: apps/native
        run: bun install --ignore-scripts

      # Install required Android SDK components
      - name: Set up Android SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" 2>&1 | tail -5

      - name: Expo prebuild
        working-directory: apps/native
        continue-on-error: true
        run: |
          node_modules/.bin/expo prebuild --platform android --clean --no-install 2>&1
          echo "prebuild exit: $?"
        env:
          EXPO_NO_TELEMETRY: "1"

      - name: Locate gradlew
        id: find-android
        run: |
          GRADLEW=$(find . -name "gradlew" -not -path "*/node_modules/*" 2>/dev/null | head -1)
          [ -n "$GRADLEW" ] || { echo "No gradlew found"; ls apps/native/; exit 1; }
          echo "Found: $GRADLEW"
          echo "gradlew=$GRADLEW" >> $GITHUB_OUTPUT
          echo "android_dir=$(dirname $GRADLEW)" >> $GITHUB_OUTPUT

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: |
          chmod +x ${{ steps.find-android.outputs.gradlew }}
          cd ${{ steps.find-android.outputs.android_dir }}
          echo "=== gradle.properties ==="
          cat gradle.properties 2>/dev/null || true
          echo "=== Gradle build ==="
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -100

      - name: Find APK
        run: |
          APK=$(find . -name "app-debug.apk" -not -path "*/node_modules/*" | head -1)
          echo "APK: ${APK:-NOT FOUND}"
          echo "apk=$APK" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: openchat-android-debug
          path: ${{ env.apk }}
          if-no-files-found: error
          retention-days: 30
