name: Build Android APK (debug)

on:
  push:
    branches: [feature/mobile-app]
  workflow_dispatch:

jobs:
  build-android:
    name: Expo prebuild → Gradle assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      EXPO_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      EXPO_PUBLIC_AUTH_BASE_URL: https://placeholder.convex.site
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false -Dkotlin.incremental=false"
      EXPO_NO_TELEMETRY: "1"
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Bun 1.3.5
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install workspace dependencies (root)
        run: bun install

      # Separate install inside the native app so expo can find its own packages
      - name: Install native app dependencies
        working-directory: apps/native
        run: bun install

      - name: Verify expo CLI version
        working-directory: apps/native
        run: bunx expo --version

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      # Prebuild with verbose output captured to a file for debugging
      - name: Expo prebuild – Android only
        working-directory: apps/native
        run: |
          bunx expo prebuild --platform android --clean 2>&1 | tee /tmp/prebuild.log
          EXIT=${PIPESTATUS[0]}
          echo "=== prebuild exit code: $EXIT ==="
          if [ $EXIT -ne 0 ]; then
            echo "--- last 60 lines of prebuild output ---"
            tail -60 /tmp/prebuild.log
            exit $EXIT
          fi
        env:
          EXPO_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
          EXPO_PUBLIC_AUTH_BASE_URL: https://placeholder.convex.site
          EXPO_NO_TELEMETRY: "1"

      - name: Confirm android directory was created
        run: |
          ls -la apps/native/android/
          ls apps/native/android/app/

      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('apps/native/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Cache Gradle caches
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/native/android/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make Gradle wrapper executable
        run: chmod +x apps/native/android/gradlew

      - name: Build debug APK
        working-directory: apps/native/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openchat-android-debug
          path: apps/native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Always upload the prebuild log so we can debug even on failure
      - name: Upload prebuild log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-log
          path: /tmp/prebuild.log
          if-no-files-found: ignore
          retention-days: 7
