name: Build Android APK (debug)

# Triggers:
#   - automatically on every push to this branch
#   - manually from the Actions tab (workflow_dispatch)
on:
  push:
    branches: [feature/mobile-app]
  workflow_dispatch:

jobs:
  build-android:
    name: Expo prebuild → Gradle assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Placeholder values so the Metro bundler can inline EXPO_PUBLIC_* vars
      # without throwing at module-load time. The APK structure will be correct;
      # users just need to point it at their own deployment at runtime via .env.
      EXPO_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      EXPO_PUBLIC_AUTH_BASE_URL: https://placeholder.convex.site
      # Android SDK path on GitHub ubuntu-latest runners
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      # Gradle JVM tuning for the 7 GB runner
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false -Dkotlin.incremental=false"

    steps:
      # ── 1. Source ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Toolchain ──────────────────────────────────────────────────────
      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Bun 1.3.5
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'

      # ── 3. Dependencies ───────────────────────────────────────────────────
      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install workspace dependencies
        run: bun install

      # ── 4. Expo prebuild ──────────────────────────────────────────────────
      # Generates apps/native/android/ from the Expo config and auto-links
      # all native modules (expo-notifications, expo-document-picker, etc.).
      - name: Expo prebuild – Android only
        working-directory: apps/native
        run: bunx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
          EXPO_PUBLIC_AUTH_BASE_URL: https://placeholder.convex.site

      # ── 5. Gradle cache ───────────────────────────────────────────────────
      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('apps/native/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Cache Gradle caches
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/native/android/**/*.gradle*', 'apps/native/android/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ── 6. Build ──────────────────────────────────────────────────────────
      - name: Make Gradle wrapper executable
        run: chmod +x apps/native/android/gradlew

      - name: Build debug APK
        working-directory: apps/native/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ── 7. Artifact ───────────────────────────────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openchat-android-debug
          path: apps/native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
