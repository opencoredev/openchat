name: Build Android APK (debug)

on:
  push:
    branches: [feature/mobile-app]
  workflow_dispatch:

jobs:
  build-android:
    name: Expo prebuild → Gradle assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      EXPO_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      EXPO_PUBLIC_AUTH_BASE_URL: https://placeholder.convex.site
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"
      EXPO_NO_TELEMETRY: "1"
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.5' }

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install workspace dependencies
        run: bun install

      - name: Install native app dependencies
        working-directory: apps/native
        run: bun install

      - name: Verify expo
        working-directory: apps/native
        run: |
          echo "Expo location:"
          ls node_modules/.bin/expo 2>/dev/null && echo "Found in apps/native/node_modules" || echo "Not in apps/native/node_modules"
          ls ../../node_modules/.bin/expo 2>/dev/null && echo "Found in root/node_modules" || echo "Not in root/node_modules"
          node node_modules/.bin/expo --version 2>&1 || node ../../node_modules/.bin/expo --version 2>&1 || echo "Expo not runnable"

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Expo prebuild
        working-directory: apps/native
        run: |
          EXPO_BIN=$(ls node_modules/.bin/expo 2>/dev/null && echo "node_modules/.bin/expo" || echo "../../node_modules/.bin/expo")
          echo "Using: $EXPO_BIN"
          node $EXPO_BIN prebuild --platform android --clean --no-install 2>&1
          echo "Exit: $?"
          ls -la android/ 2>/dev/null || echo "No android/ dir"
        env:
          EXPO_NO_TELEMETRY: "1"

      - name: Find gradlew
        id: find-android
        run: |
          GRADLEW=$(find . -name "gradlew" -not -path "*/node_modules/*" 2>/dev/null | head -1)
          echo "Found: $GRADLEW"
          [ -n "$GRADLEW" ] || (echo "No gradlew"; exit 1)
          echo "gradlew=$GRADLEW" >> $GITHUB_OUTPUT
          echo "android_dir=$(dirname $GRADLEW)" >> $GITHUB_OUTPUT

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: |
          chmod +x ${{ steps.find-android.outputs.gradlew }}
          cd ${{ steps.find-android.outputs.android_dir }}
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        run: |
          APK=$(find . -name "app-debug.apk" -not -path "*/node_modules/*" | head -1)
          echo "apk=$APK" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: openchat-android-debug
          path: ${{ env.apk }}
          if-no-files-found: error
          retention-days: 30
