name: Build Android APK (debug)

on:
  push:
    branches: [feature/mobile-app]
  workflow_dispatch:

jobs:
  build-android:
    name: Expo prebuild → Gradle assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      EXPO_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      EXPO_PUBLIC_AUTH_BASE_URL: https://placeholder.convex.site
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"
      EXPO_NO_TELEMETRY: "1"
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.5' }

      - name: Install workspace deps
        run: bun install

      - name: Install native app deps
        working-directory: apps/native
        run: bun install

      - name: Accept SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      # Write ALL output (stdout + stderr) to a file so we can read it as artifact
      - name: Run expo prebuild (output captured)
        working-directory: apps/native
        continue-on-error: true
        id: prebuild
        run: |
          set +e
          echo "CWD: $(pwd)" > /tmp/prebuild.txt
          echo "=== bun/node/expo versions ==" >> /tmp/prebuild.txt
          node --version >> /tmp/prebuild.txt 2>&1
          bun --version >> /tmp/prebuild.txt 2>&1
          ls ../../node_modules/.bin/expo >> /tmp/prebuild.txt 2>&1
          ls node_modules/.bin/expo >> /tmp/prebuild.txt 2>&1
          echo "=== Running prebuild ==" >> /tmp/prebuild.txt
          node ../../node_modules/.bin/expo prebuild --platform android --clean --no-install >> /tmp/prebuild.txt 2>&1
          RC=$?
          echo "Exit code: $RC" >> /tmp/prebuild.txt
          echo "=== ls after prebuild ==" >> /tmp/prebuild.txt
          ls -la >> /tmp/prebuild.txt 2>&1
          cat /tmp/prebuild.txt
          exit $RC
        env:
          EXPO_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
          EXPO_PUBLIC_AUTH_BASE_URL: https://placeholder.convex.site
          EXPO_NO_TELEMETRY: "1"

      # Always upload the prebuild output
      - name: Upload prebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-output
          path: /tmp/prebuild.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Find gradlew
        id: find-android
        run: |
          GRADLEW=$(find . -name "gradlew" -not -path "*/node_modules/*" 2>/dev/null | head -1)
          if [ -z "$GRADLEW" ]; then echo "ERROR: no gradlew"; exit 1; fi
          echo "Found: $GRADLEW"
          echo "gradlew=$GRADLEW" >> $GITHUB_OUTPUT
          echo "android_dir=$(dirname $GRADLEW)" >> $GITHUB_OUTPUT

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: |
          chmod +x ${{ steps.find-android.outputs.gradlew }}
          cd ${{ steps.find-android.outputs.android_dir }}
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        run: |
          APK=$(find . -name "app-debug.apk" -not -path "*/node_modules/*" | head -1)
          echo "apk=$APK" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: openchat-android-debug
          path: ${{ env.apk }}
          if-no-files-found: error
          retention-days: 30
