name: Build Android APK (debug)

on:
  push:
    branches: [feature/mobile-app]
  workflow_dispatch:

jobs:
  build-android:
    name: Expo prebuild → Gradle assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      EXPO_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      EXPO_PUBLIC_AUTH_BASE_URL: https://placeholder.convex.site
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"
      EXPO_NO_TELEMETRY: "1"
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >
            tools
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;26.1.10909125
            cmake;3.22.1

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.5' }

      - name: Install native dependencies
        working-directory: apps/native
        run: bun install --ignore-scripts

      - name: Expo prebuild (Android)
        working-directory: apps/native
        continue-on-error: true
        run: node_modules/.bin/expo prebuild --platform android --clean --no-install 2>&1
        env:
          EXPO_NO_TELEMETRY: "1"

      - name: Locate gradlew and APK output dir
        id: find-android
        run: |
          GRADLEW=$(find . -name "gradlew" -not -path "*/node_modules/*" 2>/dev/null | head -1)
          [ -n "$GRADLEW" ] || { echo "::error::No gradlew found after prebuild"; exit 1; }
          chmod +x "$GRADLEW"
          ANDROID_DIR=$(dirname "$GRADLEW")
          # Derive the expected APK output path (relative to repo root)
          APK_DIR="${ANDROID_DIR}/app/build/outputs/apk/debug"
          echo "gradlew=$GRADLEW"         >> $GITHUB_OUTPUT
          echo "android_dir=$ANDROID_DIR" >> $GITHUB_OUTPUT
          echo "apk_dir=$APK_DIR"         >> $GITHUB_OUTPUT
          echo "Found android dir: $ANDROID_DIR"
          echo "Expected APK dir:  $APK_DIR"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}-v3
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        id: gradle-build
        working-directory: ${{ steps.find-android.outputs.android_dir }}
        run: |
          echo "=== Android SDK info ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools/" 2>/dev/null || true
          ls "$ANDROID_HOME/platforms/"   2>/dev/null || true
          echo "=== Gradle build ==="
          ./gradlew assembleDebug \
            --no-daemon \
            --no-build-cache \
            --stacktrace \
            2>&1 | tee /tmp/gradle.log
          tail -20 /tmp/gradle.log

      - name: Locate built APK
        id: find-apk
        run: |
          APK=$(find ${{ steps.find-android.outputs.apk_dir }} -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            # Fall back to a broader search
            APK=$(find . -name "app-debug.apk" -not -path "*/node_modules/*" 2>/dev/null | head -1)
          fi
          [ -n "$APK" ] || { echo "::error::APK not found after build"; exit 1; }
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "apk_name=openchat-android-debug-$(echo '${{ github.sha }}' | cut -c1-7).apk" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"
          ls -lh "$APK"

      - name: Upload Gradle log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log-${{ github.run_number }}
          path: /tmp/gradle.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find-apk.outputs.apk_name }}
          path: ${{ steps.find-apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: success()
        run: |
          echo "### ✅ Android Debug APK built successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**File:** \`${{ steps.find-apk.outputs.apk_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Download:** Go to the Actions run summary page → scroll to **Artifacts** → click the artifact to download a .zip containing the APK." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Install on Pixel 9:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Enable ‘Install unknown apps’ in Settings → Apps → Special app access" >> $GITHUB_STEP_SUMMARY
          echo "2. Transfer the APK to the phone" >> $GITHUB_STEP_SUMMARY
          echo "3. Tap the APK in the Files app to install" >> $GITHUB_STEP_SUMMARY
          echo "4. Set EXPO_PUBLIC_CONVEX_URL and EXPO_PUBLIC_AUTH_BASE_URL before launching" >> $GITHUB_STEP_SUMMARY
