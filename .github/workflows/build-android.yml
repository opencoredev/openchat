name: Build Android APK (debug)

on:
  push:
    branches: [feature/mobile-app]
  workflow_dispatch:

jobs:
  build-android:
    name: Expo prebuild → Gradle assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      EXPO_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      EXPO_PUBLIC_AUTH_BASE_URL: https://placeholder.convex.site
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false -Dkotlin.incremental=false"
      EXPO_NO_TELEMETRY: "1"
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Bun 1.3.5
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install workspace dependencies
        run: bun install

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      # Run prebuild from the repo root – expo locates apps/native via the monorepo config.
      # --no-install: we already ran bun install.
      - name: Expo prebuild – Android
        run: |
          echo "Running: npx expo prebuild --platform android --clean --no-install"
          npx expo prebuild --platform android --clean --no-install 2>&1
        env:
          EXPO_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
          EXPO_PUBLIC_AUTH_BASE_URL: https://placeholder.convex.site
          EXPO_NO_TELEMETRY: "1"

      - name: Locate generated android directory
        id: find-android
        run: |
          echo "=== Searching for gradlew ==="
          find . -name "gradlew" -not -path "*/node_modules/*" 2>/dev/null
          GRADLEW=$(find . -name "gradlew" -not -path "*/node_modules/*" | head -1)
          echo "Found gradlew: $GRADLEW"
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found! Listing top-level dirs:"
            ls -la
            ls -la apps/native/ 2>/dev/null || true
            exit 1
          fi
          ANDROID_DIR=$(dirname $GRADLEW)
          echo "android_dir=$ANDROID_DIR" >> $GITHUB_OUTPUT
          echo "gradlew=$GRADLEW" >> $GITHUB_OUTPUT

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make Gradle wrapper executable
        run: chmod +x ${{ steps.find-android.outputs.gradlew }}

      - name: Build debug APK
        run: |
          cd ${{ steps.find-android.outputs.android_dir }}
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: find-apk
        run: |
          APK=$(find . -name "*.apk" -not -path "*/node_modules/*" | head -1)
          echo "APK: $APK"
          echo "apk=$APK" >> $GITHUB_OUTPUT

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openchat-android-debug
          path: ${{ steps.find-apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 30
