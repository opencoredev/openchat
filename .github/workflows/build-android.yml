name: Build Android APK (debug)

on:
  push:
    branches: [feature/mobile-app]
  workflow_dispatch:

jobs:
  build-android:
    name: Expo prebuild → Gradle assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      EXPO_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      EXPO_PUBLIC_AUTH_BASE_URL: https://placeholder.convex.site
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"
      EXPO_NO_TELEMETRY: "1"
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'

      - name: Install workspace dependencies
        run: bun install

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      # Attempt 1: from repo root (matches build-android-local.yml)
      - name: "[Attempt 1] prebuild from repo root"
        id: attempt1
        continue-on-error: true
        run: |
          set +e
          echo "==== Attempt 1: npx expo prebuild from repo root ===="
          npx expo prebuild --platform android --clean --no-install
          RC=$?
          echo "exit code: $RC"
          echo "rc=$RC" >> $GITHUB_OUTPUT
          find . -name "gradlew" -not -path "*/node_modules/*" 2>/dev/null && echo "gradlew FOUND" || echo "gradlew NOT found"
          exit $RC

      # Attempt 2: from apps/native directory  
      - name: "[Attempt 2] prebuild from apps/native"
        if: steps.attempt1.outcome != 'success'
        id: attempt2
        continue-on-error: true
        run: |
          set +e
          echo "==== Attempt 2: npx expo prebuild from apps/native ===="
          cd apps/native
          npx expo prebuild --platform android --clean --no-install
          RC=$?
          echo "exit code: $RC"
          echo "rc=$RC" >> $GITHUB_OUTPUT
          find /home/runner/work -name "gradlew" -not -path "*/node_modules/*" 2>/dev/null && echo "gradlew FOUND" || echo "gradlew NOT found"
          exit $RC

      # Attempt 3: with full install from apps/native
      - name: "[Attempt 3] prebuild from apps/native WITH install"
        if: steps.attempt1.outcome != 'success' && steps.attempt2.outcome != 'success'
        continue-on-error: true
        run: |
          set +e
          echo "==== Attempt 3: expo prebuild with install from apps/native ===="
          cd apps/native
          npx expo prebuild --platform android --clean
          RC=$?
          echo "exit code: $RC"
          find /home/runner/work -name "gradlew" -not -path "*/node_modules/*" 2>/dev/null
          exit $RC

      - name: Locate gradlew (any attempt)
        id: find-android
        run: |
          GRADLEW=$(find . -name "gradlew" -not -path "*/node_modules/*" 2>/dev/null | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found after all attempts"
            echo "Listing apps/native/:"
            ls -la apps/native/ 2>/dev/null || echo "no apps/native"
            exit 1
          fi
          echo "Found: $GRADLEW"
          echo "gradlew=$GRADLEW" >> $GITHUB_OUTPUT
          echo "android_dir=$(dirname $GRADLEW)" >> $GITHUB_OUTPUT

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: |
          GRADLEW="${{ steps.find-android.outputs.gradlew }}"
          ANDROID_DIR="${{ steps.find-android.outputs.android_dir }}"
          chmod +x $GRADLEW
          cd $ANDROID_DIR
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find and upload APK
        run: |
          APK=$(find . -name "app-debug.apk" -not -path "*/node_modules/*" | head -1)
          echo "APK location: $APK"
          if [ -z "$APK" ]; then
            find . -name "*.apk" -not -path "*/node_modules/*" 2>/dev/null
            exit 1
          fi
          echo "apk=$APK" >> $GITHUB_ENV

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openchat-android-debug
          path: ${{ env.apk }}
          if-no-files-found: error
          retention-days: 30
