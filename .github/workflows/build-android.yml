name: Build Android APK (debug)

on:
  push:
    branches: [feature/mobile-app]
  workflow_dispatch:

jobs:
  build-android:
    name: Expo prebuild → Gradle assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      EXPO_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      EXPO_PUBLIC_AUTH_BASE_URL: https://placeholder.convex.site
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false -Dkotlin.incremental=false"
      # Suppress Expo telemetry prompts in CI
      EXPO_NO_TELEMETRY: "1"
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Bun 1.3.5
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install workspace dependencies (root)
        run: bun install

      # Install native app deps separately to ensure local node_modules exists
      # (some Expo tooling requires node_modules in the project dir itself)
      - name: Install native app dependencies
        working-directory: apps/native
        run: bun install

      - name: Verify expo CLI is reachable
        working-directory: apps/native
        run: bunx expo --version

      - name: Diagnostics
        working-directory: apps/native
        run: |
          echo "--- Node modules check ---"
          ls node_modules | head -30 || echo "No node_modules in apps/native"
          echo "--- Workspace server package ---"
          ls node_modules/server 2>/dev/null && echo "server found" || echo "server not found (will try root)"
          ls ../../node_modules/server 2>/dev/null && echo "server found in root" || echo "server not found in root either"
          echo "--- Android SDK ---"
          ls $ANDROID_HOME/platforms 2>/dev/null | head -5 || echo "No platforms dir"
          ls $ANDROID_HOME/build-tools 2>/dev/null | head -5 || echo "No build-tools dir"
          sdkmanager --list_installed 2>/dev/null | head -20 || echo "sdkmanager not in PATH"
          echo "--- PATH ---"
          echo $PATH

      # Ensure Android SDK build-tools are available (ubuntu-latest ships SDK 34)
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Expo prebuild – Android only
        working-directory: apps/native
        run: bunx expo prebuild --platform android --clean --no-install
        env:
          EXPO_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
          EXPO_PUBLIC_AUTH_BASE_URL: https://placeholder.convex.site
          EXPO_NO_TELEMETRY: "1"

      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('apps/native/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Cache Gradle caches
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/native/android/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make Gradle wrapper executable
        run: chmod +x apps/native/android/gradlew

      - name: Build debug APK
        working-directory: apps/native/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openchat-android-debug
          path: apps/native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
