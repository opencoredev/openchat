name: Build Android APK (debug)

on:
  push:
    branches: [feature/mobile-app]
  workflow_dispatch:

jobs:
  build-android:
    name: Expo prebuild → Gradle assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      EXPO_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      EXPO_PUBLIC_AUTH_BASE_URL: https://placeholder.convex.site
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"
      EXPO_NO_TELEMETRY: "1"
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'

      - name: Install workspace dependencies
        run: bun install

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      # Run prebuild from apps/native - this is where app.json lives
      - name: Expo prebuild (from apps/native)
        run: |
          cd apps/native
          echo "CWD: $(pwd)"
          echo "=== before prebuild ==="
          ls
          echo "=== running prebuild ==="
          npx expo prebuild --platform android --clean --no-install 2>&1
          echo "=== after prebuild (exit $?) ==="
          ls
          echo "=== searching for android dir ==="
          find . -maxdepth 3 -type d -name "android" 2>/dev/null || echo "no android dir found"
          find . -name "gradlew" 2>/dev/null || echo "no gradlew found"
        continue-on-error: true
        env:
          EXPO_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
          EXPO_PUBLIC_AUTH_BASE_URL: https://placeholder.convex.site
          EXPO_NO_TELEMETRY: "1"

      - name: Full filesystem scan for android artifacts
        run: |
          echo "=== All gradlew files on runner ==="
          find /home/runner/work -name "gradlew" 2>/dev/null || echo "none"
          find /tmp -name "gradlew" 2>/dev/null || echo "none in /tmp"
          echo "=== apps/native directory listing ==="
          ls -la apps/native/
          echo "=== any android directories ==="
          find . -type d -name "android" -not -path "*/node_modules/*" 2>/dev/null

      - name: Locate gradlew
        id: find-android
        run: |
          GRADLEW=$(find . -name "gradlew" -not -path "*/node_modules/*" 2>/dev/null | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi
          echo "Found: $GRADLEW"
          echo "gradlew=$GRADLEW" >> $GITHUB_OUTPUT
          echo "android_dir=$(dirname $GRADLEW)" >> $GITHUB_OUTPUT

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: |
          chmod +x ${{ steps.find-android.outputs.gradlew }}
          cd ${{ steps.find-android.outputs.android_dir }}
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        run: |
          APK=$(find . -name "app-debug.apk" -not -path "*/node_modules/*" | head -1)
          echo "apk=$APK" >> $GITHUB_ENV

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: openchat-android-debug
          path: ${{ env.apk }}
          if-no-files-found: error
          retention-days: 30
