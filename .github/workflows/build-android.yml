name: Build Android APK (debug)

on:
  push:
    branches: [feature/mobile-app]
  workflow_dispatch:

jobs:
  build-android:
    name: Expo prebuild → Gradle assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      EXPO_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      EXPO_PUBLIC_AUTH_BASE_URL: https://placeholder.convex.site
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"
      EXPO_NO_TELEMETRY: "1"
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.5' }

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/native/package.json') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install native dependencies (standalone)
        working-directory: apps/native
        run: bun install --ignore-scripts

      - name: Set up Android SDK components
        run: |
          SDKMANAGER=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --licenses 2>/dev/null || true
          $SDKMANAGER "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3

      - name: Expo prebuild
        working-directory: apps/native
        continue-on-error: true
        run: node_modules/.bin/expo prebuild --platform android --clean --no-install 2>&1
        env:
          EXPO_NO_TELEMETRY: "1"

      - name: Locate gradlew
        id: find-android
        run: |
          GRADLEW=$(find . -name "gradlew" -not -path "*/node_modules/*" 2>/dev/null | head -1)
          [ -n "$GRADLEW" ] || { echo "No gradlew found"; exit 1; }
          echo "Found: $GRADLEW"
          echo "gradlew=$GRADLEW" >> $GITHUB_OUTPUT
          echo "android_dir=$(dirname $GRADLEW)" >> $GITHUB_OUTPUT

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        id: gradle-build
        run: |
          chmod +x ${{ steps.find-android.outputs.gradlew }}
          cd ${{ steps.find-android.outputs.android_dir }}
          echo "=== gradle.properties ==="
          cat gradle.properties 2>/dev/null | head -20
          echo "=== Android SDK available ==="
          ls $ANDROID_HOME/build-tools/ 2>/dev/null || echo "no build-tools"
          ls $ANDROID_HOME/platforms/ 2>/dev/null || echo "no platforms"
          echo "=== Running Gradle ==="
          set +e
          OUTPUT=$(./gradlew assembleDebug --no-daemon --stacktrace 2>&1)
          RC=$?
          echo "$OUTPUT" | tail -80
          echo "## Gradle Build" >> $GITHUB_STEP_SUMMARY
          printf '```\n%s\n```\n' "$(echo "$OUTPUT" | tail -60)" >> $GITHUB_STEP_SUMMARY
          echo "Exit: $RC" >> $GITHUB_STEP_SUMMARY
          exit $RC

      - name: Find and verify APK
        run: |
          find . -name "*.apk" -not -path "*/node_modules/*" 2>/dev/null

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openchat-android-debug
          path: "apps/native/android/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
          retention-days: 30
