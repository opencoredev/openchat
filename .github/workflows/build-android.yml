name: Build Android APK (debug)

on:
  push:
    branches: [feature/mobile-app]
  workflow_dispatch:

jobs:
  build-android:
    name: Expo prebuild → Gradle assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      EXPO_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      EXPO_PUBLIC_AUTH_BASE_URL: https://placeholder.convex.site
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"
      EXPO_NO_TELEMETRY: "1"
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.5' }

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/native/package.json') }}
          restore-keys: ${{ runner.os }}-bun-

      # Install ONLY apps/native deps in isolation (no workspace, no root)
      - name: Install native dependencies (standalone)
        working-directory: apps/native
        run: |
          # Force bun to treat this as a standalone project, not a workspace member
          # by temporarily removing the root package.json reference
          bun install --ignore-scripts 2>&1
          echo "bun install exit: $?"
          ls node_modules/.bin/expo 2>/dev/null && echo "expo found" || echo "expo NOT found"

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Expo prebuild
        working-directory: apps/native
        continue-on-error: true
        id: prebuild
        run: |
          set +e
          echo "Expo version:"
          node_modules/.bin/expo --version 2>&1
          echo "Running prebuild..."
          OUTPUT=$(node_modules/.bin/expo prebuild --platform android --clean --no-install 2>&1)
          RC=$?
          echo "$OUTPUT"
          echo "## Prebuild" >> $GITHUB_STEP_SUMMARY
          printf '```\n%s\n```\n' "$OUTPUT" >> $GITHUB_STEP_SUMMARY
          echo "Exit: $RC" >> $GITHUB_STEP_SUMMARY
          echo "rc=$RC" >> $GITHUB_OUTPUT
          exit $RC
        env:
          EXPO_NO_TELEMETRY: "1"

      - name: Check android dir
        run: |
          ls -la apps/native/ | grep android || echo "No android dir"
          GRADLEW=$(find . -name "gradlew" -not -path "*/node_modules/*" 2>/dev/null | head -1)
          echo "gradlew: ${GRADLEW:-MISSING}"

      - name: Locate gradlew
        id: find-android
        run: |
          GRADLEW=$(find . -name "gradlew" -not -path "*/node_modules/*" 2>/dev/null | head -1)
          [ -n "$GRADLEW" ] || { echo "No gradlew"; exit 1; }
          echo "gradlew=$GRADLEW" >> $GITHUB_OUTPUT
          echo "android_dir=$(dirname $GRADLEW)" >> $GITHUB_OUTPUT

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: |
          chmod +x ${{ steps.find-android.outputs.gradlew }}
          cd ${{ steps.find-android.outputs.android_dir }}
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        run: |
          APK=$(find . -name "app-debug.apk" -not -path "*/node_modules/*" | head -1)
          echo "apk=$APK" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: openchat-android-debug
          path: ${{ env.apk }}
          if-no-files-found: error
          retention-days: 30
