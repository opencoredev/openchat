name: Build Android APK (debug)

on:
  push:
    branches: [feature/mobile-app]
  workflow_dispatch:

jobs:
  build-android:
    name: Expo prebuild → Gradle assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      EXPO_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      EXPO_PUBLIC_AUTH_BASE_URL: https://placeholder.convex.site
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"
      EXPO_NO_TELEMETRY: "1"
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'

      - name: Install workspace dependencies (root)
        run: bun install

      - name: Install native dependencies (apps/native)
        working-directory: apps/native
        run: bun install

      - name: Expo version and path check
        working-directory: apps/native
        run: |
          echo "=== Which expo? ==="
          which expo 2>/dev/null || echo "expo not in PATH"
          which npx && npx --version
          echo "=== node_modules/.bin/expo? ==="
          ls node_modules/.bin/expo 2>/dev/null || echo "not in apps/native/node_modules/.bin"
          ls ../../node_modules/.bin/expo 2>/dev/null || echo "not in root node_modules/.bin"
          echo "=== expo package? ==="
          ls node_modules/expo 2>/dev/null || echo "no expo in apps/native/node_modules"
          ls ../../node_modules/expo 2>/dev/null | head -5 || echo "no expo in root/node_modules"
          echo "=== expo --version ==="
          node_modules/.bin/expo --version 2>/dev/null || ../../node_modules/.bin/expo --version 2>/dev/null || npx expo --version 2>&1 || echo "CANNOT RUN EXPO"

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      # Use the expo binary directly from node_modules to avoid npx cache issues
      - name: Run expo prebuild
        working-directory: apps/native
        run: |
          EXPO_BIN=$(ls node_modules/.bin/expo 2>/dev/null || ls ../../node_modules/.bin/expo 2>/dev/null || echo "")
          if [ -z "$EXPO_BIN" ]; then
            echo "No expo binary found, trying npx"
            EXPO_CMD="npx expo"
          else
            echo "Using expo at: $EXPO_BIN"
            EXPO_CMD="$EXPO_BIN"
          fi
          echo "Running: $EXPO_CMD prebuild --platform android --clean --no-install"
          $EXPO_CMD prebuild --platform android --clean --no-install 2>&1
          EXIT=$?
          echo "Exit code: $EXIT"
          echo "=== Contents of apps/native/ after prebuild ==="
          ls -la
        env:
          EXPO_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
          EXPO_PUBLIC_AUTH_BASE_URL: https://placeholder.convex.site
          EXPO_NO_TELEMETRY: "1"

      - name: Locate gradlew after prebuild
        id: find-android
        run: |
          echo "=== Finding gradlew ==="
          find . -name "gradlew" -not -path "*/node_modules/*" 2>/dev/null
          GRADLEW=$(find . -name "gradlew" -not -path "*/node_modules/*" 2>/dev/null | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: No gradlew found"
            echo "Apps/native contents:"
            ls -la apps/native/ 2>/dev/null
            exit 1
          fi
          echo "Found at: $GRADLEW"
          echo "gradlew=$GRADLEW" >> $GITHUB_OUTPUT
          echo "android_dir=$(dirname $GRADLEW)" >> $GITHUB_OUTPUT

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: |
          chmod +x ${{ steps.find-android.outputs.gradlew }}
          cd ${{ steps.find-android.outputs.android_dir }}
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        run: |
          APK=$(find . -name "app-debug.apk" -not -path "*/node_modules/*" 2>/dev/null | head -1)
          echo "apk=$APK" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openchat-android-debug
          path: ${{ env.apk }}
          if-no-files-found: error
          retention-days: 30
