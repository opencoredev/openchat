name: Build Android APK (debug)

on:
  push:
    branches: [feature/mobile-app]
  workflow_dispatch:

jobs:
  build-android:
    name: Expo prebuild → Gradle assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      EXPO_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      EXPO_PUBLIC_AUTH_BASE_URL: https://placeholder.convex.site
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false -Dkotlin.incremental=false"
      EXPO_NO_TELEMETRY: "1"
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Bun 1.3.5
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install workspace dependencies
        run: bun install

      - name: Check expo version
        run: |
          echo "=== npx expo --version ==="
          cd apps/native && npx expo --version 2>&1 || true
          echo "=== bunx expo --version ==="
          cd apps/native && bunx expo --version 2>&1 || true

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      # Run prebuild from the REPO ROOT (not apps/native), same as build-android-local.yml
      # Point it at apps/native by passing --source-dir option.
      # --no-install: skip re-running package manager (we already ran bun install).
      - name: Expo prebuild – Android (from repo root)
        continue-on-error: true
        id: prebuild
        run: |
          echo "--- trying from repo root ---"
          npx expo prebuild --platform android --clean --no-install 2>&1 | tail -50
          echo "Exit: ${PIPESTATUS[0]}"

      - name: Expo prebuild – Android (from apps/native, with npx)
        if: steps.prebuild.outcome == 'failure'
        continue-on-error: true
        id: prebuild2
        run: |
          echo "--- trying npx from apps/native ---"
          cd apps/native && npx expo prebuild --platform android --clean --no-install 2>&1 | tail -60
          echo "Exit: ${PIPESTATUS[0]}"

      - name: Expo prebuild – Android (from apps/native, with bunx, with install)
        if: steps.prebuild2.outcome == 'failure'
        run: |
          echo "--- trying bunx from apps/native (with install) ---"
          cd apps/native && bunx expo prebuild --platform android --clean 2>&1

      - name: List android directory
        run: |
          ls -la apps/native/android/ 2>/dev/null || echo "No android dir"
          ls apps/native/android/app/ 2>/dev/null || echo "No android/app dir"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/native/android/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make Gradle wrapper executable
        run: chmod +x apps/native/android/gradlew

      - name: Build debug APK
        working-directory: apps/native/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openchat-android-debug
          path: apps/native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
